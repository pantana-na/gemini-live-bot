# Google Cloud Build Pipeline for Gemini Live Bot
# Conforms to Google Cloud DevOps, Security & Quality Standards (Rules 5, 6 & 10)

substitutions:
  _ENVIRONMENT: "nonprod"
  _REGION: "asia-southeast1"
  _ARTIFACT_REGISTRY: "cloudrun-app"
  _SERVICE_NAME: "gemini-live-bot-nonprod"

steps:
  # Step 1: Build hardened Docker container image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/gemini-live-bot:${_ENVIRONMENT}-${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/gemini-live-bot:${_ENVIRONMENT}-latest"
      - "."

  # Step 2: Push image to Google Cloud Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/gemini-live-bot"

  # Step 3: Deploy revision to Google Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/gemini-live-bot:${_ENVIRONMENT}-${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--port=8080"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--liveness-probe=path=/health,initialDelaySeconds=5,periodSeconds=15,timeoutSeconds=3,failureThreshold=3"
      - "--set-env-vars=ENVIRONMENT=${_ENVIRONMENT},LIVE_API_MODEL=gemini-3.1-flash-live-preview,GOOGLE_GENAI_USE_VERTEXAI=FALSE"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/gemini-live-bot:${_ENVIRONMENT}-${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/gemini-live-bot:${_ENVIRONMENT}-latest"

options:
  logging: CLOUD_LOGGING_ONLY
