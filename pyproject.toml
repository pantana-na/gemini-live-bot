[project]
name = "gemini-live-bot"
version = "0.1.0"
description = "Enterprise Multimodal Voice Agent with Google ADK and Gemini Live"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.8.0",
    "google-genai>=2.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
